    block_engine_url: ny.mainnet.block-engine.jito.wtf:443
  - name: Amsterdam
    block_engine_url: amsterdam.mainnet.block-engine.jito.wtf:443
  - name: Frankfurt
    block_engine_url: frankfurt.mainnet.block-engine.jito.wtf:443
  - name: Tokyo
    block_engine_url: tokyo.mainnet.block-engine.jito.wtf:443
  - name: SaltLakeCity
    block_engine_url: slc.mainnet.block-engine.jito.wtf:443
  - name: London
    block_engine_url: london.mainnet.block-engine.jito.wtf:443
  - name: Singapore
    block_engine_url: singapore.mainnet.block-engine.jito.wtf:443
  - name: Dublin
    block_engine_url: dublin.mainnet.block-engine.jito.wtf:443
  # - name: Mainnet
  #   block_engine_url: mainnet.block-engine.jito.wtf:443

# ==================== gRPC端口到区域映射 ====================
# 格式: 端口号: 区域索引 (从0开始)
grpc_port_mapping:
  8011: 0  # NewYork
  8012: 1  # Amsterdam
  8013: 2  # Frankfurt
  8014: 3  # Tokyo
  8015: 4  # SaltLakeCity
  8016: 5  # London
  8017: 6  # Singapore
  8018: 7  # Dublin
  # 8019: 8  # Mainnet

